services:
  frontend:
    image: frontend-image
    build: ../cloth_shop_web
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - product-images:/usr/share/nginx/html/uploads
  backend:
    image: backend-image
    build: ../cloth_shop_server
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shopping_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-123}"
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      start_period: 60s
      interval: 5s
      timeout: 3s
      retries: 24
    volumes:
      - product-images:/app/uploads
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-123}"
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopping_db"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - database-data:/var/lib/postgresql/data
volumes:
  product-images:
  database-data:
